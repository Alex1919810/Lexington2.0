[package]
name = "lexington"
version = "2.0.0"
edition = "2024"
description = "Pure Rust desktop pet"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
gif = "0.14"
url = "2"
toml = "0.9"
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
x11rb = { version = "0.13", features = ["shape", "randr", "screensaver"] }
