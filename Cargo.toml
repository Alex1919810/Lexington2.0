[package]
name = "lexington"
version = "2.0.0"
edition = "2024"
description = "Pure Rust desktop pet"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
gif = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
x11rb = "0.13"
